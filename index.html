<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Холодильник</title>
<meta name="description" content="Виртуальная 3D-кухня: продукты по местам хранения, подбор рецептов по наличию и пошаговое приготовление с таймерами.">
<meta name="theme-color" content="#1F3D2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cabinet-green:#1F3D2B; --cabinet-green-dark:#16301F; --countertop-stone:#E8E4DC; --stone-vein:#CFC8BC;
  --fridge-white:#F5F5F2; --appliance-black:#151515; --handle-metal:#9A9A96; --wall:#F2F0EB; --floor:#CDB79A;
  --accent:#E3B34C; --success:#4C9A6A; --warning:#E0A030; --danger:#C2453D;
  --text:#1B1B1B; --muted:#596059; --bg:#F2F0EB; --surface:rgba(255,255,255,.92); --surface-solid:#FFFFFF;
  --surface-2:#F4F1EA; --line:rgba(31,61,43,.14); --heading:#1F3D2B; --primary:#1F3D2B;
  --success-bg:#DDEFE3; --success-text:#2B6A44; --warning-bg:#FBEBC8; --warning-text:#6B4A08;
  --danger-bg:#F7DEDB; --danger-text:#A3352E; --shadow:0 10px 32px rgba(22,48,31,.16); --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --text:#EDEDEA; --muted:#A8B0AA; --bg:#121613; --surface:rgba(26,31,28,.92); --surface-solid:#1A1F1C;
    --surface-2:#232A25; --line:rgba(237,237,234,.13); --heading:#A9D6B9; --primary:#2E5E42;
    --success-bg:#1D3A29; --success-text:#93D3AC; --warning-bg:#45360F; --warning-text:#F4D58E;
    --danger-bg:#4A201C; --danger-text:#F3A69E; --shadow:0 10px 32px rgba(0,0,0,.5);
  }
}
html{font-size:var(--fs)}
html.big{--fs:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45;color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{line-height:1.2}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--primary);color:#fff;padding:8px 12px;border-radius:8px}
.skip:focus{top:8px}
.muted{color:var(--muted)}
.grow{flex:1}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:30;position:relative}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:1.12rem;color:var(--heading);white-space:nowrap}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--cabinet-green);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 3px 0 0 var(--accent)}
.search{position:relative;flex:1;max-width:440px;min-width:0}
.search input[type=search]{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px 0 38px}
.search::before{content:'';position:absolute;left:14px;top:50%;width:11px;height:11px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%);pointer-events:none}
.search::after{content:'';position:absolute;left:25px;top:24px;width:6px;height:2px;background:var(--muted);transform:rotate(45deg);pointer-events:none}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:70;padding:6px;margin:0;list-style:none}
.dropdown [role=option]{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.dropdown [role=option][aria-selected=true],.dropdown [role=option]:hover{background:var(--surface-2)}
.dd-ico{font-size:1.2rem;width:26px;text-align:center}
.dd-sub{color:var(--muted);font-size:.84rem}
.viewtoggle{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.viewtoggle button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted)}
.viewtoggle button[aria-pressed=true]{background:var(--primary);color:#fff}
.topnav{display:flex;gap:2px;margin-left:auto;flex:none}
.topnav a{text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.topnav a:hover,.topnav a[aria-current=page]{background:var(--surface-2);color:var(--heading)}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#1b1b1b;font-size:.74rem;text-align:center;font-weight:800;line-height:20px}
.count:empty{display:none}
#banner{padding:8px 16px;background:var(--warning-bg);color:var(--warning-text);font-size:.9rem;display:flex;gap:12px;align-items:center}
#banner[hidden]{display:none}
#timerbar{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);z-index:25}
#timerbar:not(:empty){padding:8px 16px;border-bottom:1px solid var(--line)}
.tchip{display:inline-flex;align-items:center;gap:8px;background:var(--cabinet-green);color:#fff;border-radius:999px;padding:4px 5px 4px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.tchip .tl{font-weight:600;opacity:.85;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip button{border:0;background:rgba(255,255,255,.2);color:inherit;width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:800}
.tchip.done{background:var(--accent);color:#1b1b1b;animation:blink 1s infinite}
@keyframes blink{50%{filter:brightness(1.12);transform:scale(1.04)}}

/* ---------- layout ---------- */
main{flex:1;min-height:0;display:flex;position:relative}
#stage{flex:1;min-width:0;position:relative;overflow:hidden;background:linear-gradient(#ECE8E0,#D9CDBB)}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#scene canvas.pointer{cursor:pointer}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#overlay>[data-anchor]{position:absolute;left:0;top:0;will-change:transform}
.qbadge{background:rgba(255,255,255,.96);color:#1b1b1b;border-radius:999px;padding:1px 7px;font-size:.72rem;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap;border:2px solid transparent;transition:background .2s}
.qbadge.soon{border-color:var(--warning);background:#FFF4DA}
.qbadge.expired{border-color:var(--danger);background:#FBE3E0}
.qbadge.more{background:#3a3f3b;color:#fff}
.qbadge.hl{background:var(--accent)}
.fbadge{background:var(--cabinet-green);color:#fff;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.25);white-space:nowrap}
.fbadge.warn{background:var(--warning);color:#1b1b1b}
.alabel{background:rgba(21,21,21,.9);color:#fff;border-radius:10px;padding:5px 10px;font-size:.82rem;font-weight:700;white-space:nowrap;border:1px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.atimer{background:var(--accent);color:#1b1b1b;border-radius:999px;padding:2px 9px;font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.scene-btn{pointer-events:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:transparent;opacity:0;padding:0}
.scene-btn:focus-visible{opacity:1;background:rgba(227,179,76,.3);outline:3px solid var(--accent);outline-offset:0;color:transparent}
@media (pointer:coarse){
  .scene-btn.touch{pointer-events:auto;opacity:1;width:auto;height:auto;min-width:44px;min-height:30px;border-radius:999px;background:rgba(31,61,43,.85);color:#fff;font-size:.72rem;font-weight:800;padding:4px 8px}
}
.hint{background:var(--accent);color:#1b1b1b;padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:230px;font-size:.92rem;animation:bob 1.6s ease-in-out infinite}
.hint::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--accent)}
@keyframes bob{50%{margin-top:-6px}}
#tip{position:fixed;z-index:90;pointer-events:none;background:rgba(20,26,22,.92);color:#fff;padding:6px 10px;border-radius:8px;font-size:.85rem;font-weight:600;white-space:nowrap;transform:translate(12px,14px)}
#tip[hidden]{display:none}
#loader{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:linear-gradient(#ECE8E0,#D9CDBB);transition:opacity .45s}
#loader.hide{opacity:0;pointer-events:none}
.ph-kitchen{display:flex;align-items:flex-end;gap:6px;opacity:.85}
.ph-kitchen i{display:block;border-radius:6px;background:var(--cabinet-green)}
.ph-kitchen .f{width:70px;height:170px;background:#F5F5F2;box-shadow:inset 0 -62px 0 #E8E8E4}
.ph-kitchen .b{width:90px;height:80px}
.ph-kitchen .o{width:60px;height:80px;background:#151515}
.loader-txt{margin-top:16px;color:#1F3D2B;font-weight:700;text-align:center}
.loader-bar{width:220px;height:6px;border-radius:6px;background:rgba(31,61,43,.15);overflow:hidden;margin:10px auto 0}
.loader-bar i{display:block;height:100%;width:40%;background:var(--cabinet-green);border-radius:6px;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#expChip{position:absolute;left:12px;top:12px;z-index:4;display:none}
.scene-help{position:absolute;right:12px;bottom:12px;z-index:4;background:var(--surface);border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.backbtn{position:absolute;left:12px;top:12px;z-index:4}
.backbtn[hidden]{display:none}

/* ---------- panel ---------- */
#panel{width:450px;max-width:48vw;background:var(--surface-solid);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:10;box-shadow:-10px 0 30px rgba(0,0,0,.06);animation:pin .22s ease}
@keyframes pin{from{opacity:.4;transform:translateX(16px)}}
#panel[hidden]{display:none}
.sheet-handle{display:none;border:0;background:transparent;width:100%;padding:8px 0 2px;cursor:pointer}
.sheet-handle i{display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
#panelInner{flex:1;overflow:auto;padding:0 18px 28px;overscroll-behavior:contain}
.ph{position:sticky;top:0;background:var(--surface-solid);z-index:3;display:flex;align-items:flex-start;gap:10px;padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ph h2{margin:0;font-size:1.25rem;color:var(--heading)}
.ph .grow{min-width:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.sub{color:var(--muted);font-size:.9rem}
.icon-btn{border:0;background:var(--surface-2);min-width:36px;height:36px;border-radius:10px;cursor:pointer;flex:none;display:inline-grid;place-items:center;font-size:1rem;text-decoration:none;padding:0 8px}
.icon-btn:hover{filter:brightness(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:transparent;color:#fff}
.btn.accent{background:var(--accent);border-color:transparent;color:#1b1b1b}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger-text)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:transparent}
.btn.warn{background:var(--warning-bg);color:var(--warning-text);border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:8px}
.sec-title{font-size:1rem;margin:18px 0 8px;color:var(--heading)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.74rem;font-weight:800;white-space:nowrap}
.pill.warn{background:var(--warning-bg);color:var(--warning-text)}
.pill.danger{background:var(--danger-bg);color:var(--danger-text)}
.pill.ok{background:var(--success-bg);color:var(--success-text)}
.pill.gray{background:var(--surface-2);color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.empty .big{font-size:2rem;display:block;margin-bottom:6px}
select,input[type=text],input[type=search],input[type=number],input[type=date],input:not([type]){height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;min-width:0}
select.sm{height:36px}
label.check{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:36px}
label.check input{width:20px;height:20px;accent-color:var(--cabinet-green);flex:none}
.loc-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:16px 0 6px}

/* items */
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:12px;background:var(--surface-2);border-left:4px solid transparent}
.item.st-soon{border-left-color:var(--warning)}
.item.st-expired{border-left-color:var(--danger)}
.item.flash{animation:flash 1.4s ease 2}
@keyframes flash{50%{background:rgba(227,179,76,.45)}}
.item .ico{font-size:1.5rem;width:32px;text-align:center;flex:none}
.item .info{flex:1;min-width:0}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .qty{font-weight:800;color:var(--text)}
.acts{display:flex;gap:2px;flex:none}
.acts button{border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:800;color:var(--text)}
.acts button:hover{background:rgba(0,0,0,.06)}
.panel-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}

/* recipes */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:700;cursor:pointer;min-height:34px}
.chip[aria-pressed=true]{background:var(--primary);color:#fff;border-color:transparent}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface-solid);color:var(--heading);box-shadow:0 1px 4px rgba(0,0,0,.1)}
details.more-f summary{cursor:pointer;font-weight:700;color:var(--heading);padding:4px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fgrid label{font-size:.8rem;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.group-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:1rem;color:var(--heading)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{position:relative;display:flex;gap:12px;padding:10px;border-radius:14px;background:var(--surface-2);text-decoration:none;color:inherit;border:1px solid transparent;transition:border-color .15s,transform .15s}
.rcard:hover{border-color:var(--line);transform:translateY(-1px)}
.rphoto{width:84px;height:84px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 -8px 16px rgba(0,0,0,.08)}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-right:30px}
.rbody h3{margin:0;font-size:1rem}
.rmeta{font-size:.82rem;color:var(--muted)}
.rmiss{font-size:.82rem;color:var(--danger-text);font-weight:600}
.rlow{font-size:.82rem;color:var(--warning-text);font-weight:600}
.rapps{font-size:.95rem;letter-spacing:2px}
.favbtn{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:1.25rem;cursor:pointer;width:36px;height:36px;border-radius:50%;color:var(--muted)}
.favbtn[aria-pressed=true]{color:var(--accent)}
.badge-g{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:800;width:max-content;max-width:100%}
.g-can{background:var(--success-bg);color:var(--success-text)}
.g-miss{background:var(--danger-bg);color:var(--danger-text)}
.g-qty{background:var(--warning-bg);color:var(--warning-text)}
.g-noapp,.g-hidden{background:var(--surface-solid);color:var(--muted);border:1px solid var(--line)}
.hero{height:150px;border-radius:16px;display:grid;place-items:center;font-size:4.6rem;background:linear-gradient(135deg,var(--g1),var(--g2));margin-bottom:14px;box-shadow:inset 0 -18px 30px rgba(0,0,0,.08)}
.rdesc{margin:6px 0 10px}
.metas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.meta-chip{background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:.84rem;font-weight:600}
.servings{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.servings button{width:34px;height:34px;border:0;border-radius:9px;background:var(--surface-solid);cursor:pointer;font-weight:800;font-size:1.1rem}
.servings b{min-width:34px;text-align:center}
.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ing{display:grid;grid-template-columns:26px 1fr auto;gap:4px 8px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.ing .mk{font-weight:900;text-align:center;border-radius:6px;line-height:22px}
.ing .iq{font-weight:800;white-space:nowrap}
.ing .idet{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.s-ok .mk,.s-basic .mk{color:var(--success-text);background:var(--success-bg)}
.s-low .mk,.s-check .mk{color:var(--warning-text);background:var(--warning-bg)}
.s-missing .mk{color:var(--danger-text);background:var(--danger-bg)}
.s-sub .mk{color:#2f5f8a;background:#dbe9f6}
.ing em{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:700;margin-left:4px}
.ing:hover{outline:2px solid var(--accent);outline-offset:-2px}
.appchips{display:flex;gap:6px;flex-wrap:wrap}
.appchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.86rem;font-weight:700}
.appchip.no{background:var(--danger-bg);color:var(--danger-text)}
.steps-list{padding-left:22px;margin:8px 0}
.steps-list li{margin-bottom:8px}
.sticky-actions{position:sticky;bottom:-28px;background:var(--surface-solid);padding:12px 0 16px;margin-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.notice{padding:10px 12px;border-radius:12px;font-size:.88rem;margin:8px 0}
.notice.warn{background:var(--warning-bg);color:var(--warning-text)}
.notice.danger{background:var(--danger-bg);color:var(--danger-text)}
.notice.ok{background:var(--success-bg);color:var(--success-text)}
.notice.info{background:var(--surface-2)}

/* cooking */
.progress{display:flex;gap:4px;margin:4px 0 14px}
.progress button{flex:1;height:10px;border:0;border-radius:5px;background:var(--surface-2);cursor:pointer;padding:0;min-width:10px}
.progress button.done{background:var(--success)}
.progress button.cur{background:var(--accent)}
.stepno{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:.8rem;letter-spacing:.05em}
.steptext{font-size:1.32rem;font-weight:700;line-height:1.35;margin:8px 0 14px}

.appl-box .e{font-size:1.5rem}
.tipbox{background:var(--warning-bg);color:var(--warning-text);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem}

.done-hero{text-align:center;padding:20px 0}
.done-hero .big{font-size:4rem}
.wo-row{display:grid;grid-template-columns:auto 1fr 90px auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface-2)}
.wo-row input[type=number]{width:90px;height:36px}

/* shopping & settings */
.shop-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}

.add-row{display:grid;grid-template-columns:1fr 80px 90px auto;gap:6px;position:relative}
.set-sec{padding:14px 0;border-bottom:1px solid var(--line)}

.toggles{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}

dialog{border:0;border-radius:18px;padding:0;width:min(540px,calc(100% - 24px));max-height:calc(100dvh - 24px);background:var(--surface-solid);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(12,22,16,.48)}

.row2{display:grid;grid-template-columns:1fr 130px;gap:10px}
.err{color:var(--danger-text);font-size:.84rem;font-weight:600}
.err:empty{display:none}
.warnbox{background:var(--warning-bg);color:var(--warning-text);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:.9rem}
.warnbox[hidden]{display:none}
.dfoot{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.presets:empty{display:none}
.onb-ill{font-size:3.4rem;text-align:center;margin:6px 0 4px}
.onb-steps{display:flex;gap:6px;justify-content:center;margin-top:14px}
.onb-steps i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.onb-steps i.on{background:var(--cabinet-green);width:22px;border-radius:5px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;margin-bottom:8px}
.choice:hover{border-color:var(--cabinet-green)}
.choice .e{font-size:2rem}
.about p{margin:0 0 10px}

@media (max-width:767px){

  @keyframes sheet{from{transform:translateY(30px);opacity:.5}}

}
@media (prefers-reduced-motion: reduce){

<script>
/* =====================================================================
   ПРИЛОЖЕНИЕ: состояние, бизнес-логика (подбор, единицы, сроки), интерфейс

(function(){
'use strict';
const D = window.DATA, U = D.UNITS;
const $ = (s, r=document) => r.querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function plural(n, f){ n = Math.abs(Math.round(n)) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; }
const fmtNum = n => { if (n == null || !isFinite(n)) return ''; const a = Math.abs(n); const r = a >= 100 ? Math.round(n) : a >= 10 ? Math.round(n*10)/10 : Math.round(n*100)/100; return String(r).replace('.', ','); };
function fmtQty(q, u){ const un = U[u]; if (!un) return fmtNum(q); if (un.d === 'cond' || q == null) return un.n; if (u === 'g' && q >= 1000) return fmtNum(q/1000) + ' кг'; if (u === 'ml' && q >= 1000) return fmtNum(q/1000) + ' л'; return fmtNum(q) + ' ' + un.n; }
const fmtDur = s => { s = Math.round(s); if (s < 60) return s + ' сек'; const h = Math.floor(s/3600), m = Math.round((s%3600)/60); return h ? (h + ' ч' + (m ? ' ' + m + ' мин' : '')) : (m + ' мин'); };
const fmtClock = ms => { let s = Math.max(0, Math.ceil(ms/1000)); const h = Math.floor(s/3600); s -= h*3600; const m = Math.floor(s/60); s -= m*60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').trim();
const round3 = n => Math.round(n*1000)/1000;

/* ---------- единицы ---------- */
function toDim(q, u, dim, p){
  const un = U[u]; if (!un || un.d === 'cond' || q == null) return null;
  const base = q * un.f;
  if (un.d === dim) return base;
  let g = null;
  if (un.d === 'mass') g = base;
  else if (un.d === 'vol') g = p && p.density ? base * p.density : null;
  else if (un.d === 'pcs') g = p && p.piece ? base * p.piece : null;
  if (g == null) return null;
  if (dim === 'mass') return g;
  if (dim === 'vol') return p && p.density ? g / p.density : null;
  if (dim === 'pcs') return p && p.piece ? g / p.piece : null;
  return null;
}
function convert(q, from, to, p){ if (from === to) return q; const t = U[to]; if (!t || t.d === 'cond') return null; const v = toDim(q, from, t.d, p); return v == null ? null : v / t.f; }
const dimUnits = u => ({mass:['g','kg'], vol:['ml','l','tsp','tbsp','cup'], pcs:['pcs']})[U[u].d] || [u];

/* ---------- состояние ---------- */
const DEFAULT_SETTINGS = { basicProducts:['salt','sugar','black_pepper','oil_sunflower','water'], unavailableAppliances:[], viewMode:'3d', graphicsQuality:'auto',
  expiryWarningDays:2, soundEnabled:true, soundVolume:0.6, textSize:'normal', onboardingDone:false, wakeLock:true, exportReminder:true, lastExportAt:null, persistAsked:false };
const blankState = () => ({ inventory:[], settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), favorites:[], shopping:[], history:[], customProducts:[], cooking:null, timers:[], createdAt:Date.now() });
let S = blankState();
let persistOK = true;
function load(){
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch(e){ persistOK = false; return; }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){ const d = JSON.parse(raw); S = Object.assign(blankState(), d); S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}); }
  } catch(e){ console.warn('Не удалось прочитать данные', e); }
}
function save(){ if (!persistOK) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ persistOK = false; showStorageBanner(); } }
const snapshot = () => JSON.stringify({inventory:S.inventory, shopping:S.shopping, history:S.history, favorites:S.favorites, customProducts:S.customProducts});
const restore = snap => Object.assign(S, JSON.parse(snap));

const UI = { route:{name:'kitchen'}, openUnit:null, sort:'expiry', overflow:[], flashItem:null, sheetBig:false, sceneReady:false, sceneFailed:false,
  rf:{q:'', mode:'match', meal:'', time:0, diff:0, diet:'', cuisine:'', appl:'', expiring:false, showNoApp:false, sort:'best', servings:0},
  servingsSel:{}, listOpen:{fridge:true}, writeoff:null, writeoffDone:null, hintFridge:false };

/* ---------- продукты ---------- */
const FALLBACK = {name:'Продукт', emoji:'📦', category:'other', defaultUnit:'pcs', allowedUnits:['pcs'], place:'cabinet_lower_2', zone:'pantry', synonyms:[], color:'#B8B8B8'};
const P = id => D.PRODUCTS[id] || S.customProducts.find(c => c.id === id) || Object.assign({id}, FALLBACK, {name:id});
const linkedOf = pid => { const c = S.customProducts.find(x => x.id === pid); return c && c.linkedTo ? c.linkedTo : null; };
const isBasic = pid => S.settings.basicProducts.includes(pid);
const allProducts = () => D.PRODUCT_LIST.concat(S.customProducts);
const locName = id => (D.STORAGE_MAP[id] || {}).name || id;
const unitOfLoc = id => D.UNIT_MAP[D.LOC_UNIT[id]];
const shortLoc = id => { const n = locName(id); return n.replace(/\s*\(.*\)$/, '').toLowerCase().replace('холодильник — ', 'холодильник, ').replace('морозилка — ', 'морозилка, '); };

/* ---------- сроки годности ---------- */
function daysLeft(it){ if (!it.expiresAt) return null; const t0 = new Date(); t0.setHours(0,0,0,0); return Math.round((new Date(it.expiresAt + 'T00:00:00') - t0) / DAY); }
function expStatus(it){ const dl = daysLeft(it); if (dl == null) return 'ok'; if (dl < 0) return 'expired'; if (dl <= S.settings.expiryWarningDays) return 'soon'; return 'ok'; }
function expText(it){
  const dl = daysLeft(it); if (dl == null) return '';
  const d = new Date(it.expiresAt + 'T00:00:00').toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
  if (dl < 0) return 'просрочен ' + (-dl) + ' ' + plural(-dl, ['день','дня','дней']) + ' назад';
  if (dl === 0) return 'годен до сегодня';
  if (dl === 1) return 'годен до завтра';
  return 'до ' + d + ' · ' + dl + ' ' + plural(dl, ['день','дня','дней']);
}
const stPill = st => st === 'expired' ? '<span class="pill danger">Просрочен</span>' : st === 'soon' ? '<span class="pill warn">Скоро испортится</span>' : '';
const byExpiry = (a, b) => (a.expiresAt || '9999') < (b.expiresAt || '9999') ? -1 : (a.expiresAt || '9999') > (b.expiresAt || '9999') ? 1 : 0;
const expiringItems = () => S.inventory.filter(i => expStatus(i) !== 'ok').sort(byExpiry);

/* ---------- запасы ---------- */
function addInventory({productId, locationId, quantity, unit, expiresAt, note}){
  const now = new Date().toISOString();
  const ex = S.inventory.find(i => i.productId === productId && i.locationId === locationId && i.unit === unit && (i.expiresAt || '') === (expiresAt || ''));
  if (ex){ ex.quantity = round3(ex.quantity + quantity); ex.updatedAt = now; return ex; }
  const it = {id:uid(), productId, locationId, quantity:round3(quantity), unit, expiresAt:expiresAt || undefined, addedAt:now, updatedAt:now, note:note || undefined};
  S.inventory.push(it); return it;
}
const itemsInUnit = uid_ => { const u = D.UNIT_MAP[uid_]; return S.inventory.filter(i => u.locs.includes(i.locationId)); };
function stepFor(u){ return u === 'pcs' ? 1 : (u === 'g' || u === 'ml') ? 50 : (u === 'kg' || u === 'l') ? 0.1 : 1; }
function groupsForLoc(locId){
  const map = new Map();
  S.inventory.filter(i => i.locationId === locId).forEach(it => { if (!map.has(it.productId)) map.set(it.productId, []); map.get(it.productId).push(it); });
  const out = [];
  for (const [pid, arr] of map){
    arr.sort(byExpiry); const p = P(pid); let total = 0, unit = arr[0].unit, ok = true;
    for (const it of arr){ const c = convert(it.quantity, it.unit, unit, p); if (c == null){ ok = false; break; } total += c; }
    const st = arr.some(i => expStatus(i) === 'expired') ? 'expired' : arr.some(i => expStatus(i) === 'soon') ? 'soon' : 'ok';
    out.push({pid, product:p, ids:arr.map(i => i.id), qtyText: ok ? fmtQty(total, unit) : arr.length + ' поз.', status:st});
  }
  return out.sort((a, b) => a.product.name.localeCompare(b.product.name, 'ru'));
}

/* ---------- подбор рецептов (алгоритм из PRD F-04) ---------- */
let MATCH = null;
function invIndex(){
  const ok = {}, expired = {}, soon = {};
  for (const it of S.inventory){
    const pid = linkedOf(it.productId) || it.productId; const st = expStatus(it);
    if (st === 'expired'){ (expired[pid] = expired[pid] || []).push(it); continue; }
    (ok[pid] = ok[pid] || []).push(it); if (st === 'soon') soon[pid] = true;
  }
  return {ok, expired, soon};
}
function matchRecipe(r, servings, idx){
  idx = idx || invIndex();
  const sv = servings || r.serv, k = sv / r.serv;
  const res = {r, servings:sv, k, missing:[], insufficient:[], subs:[], checks:[], expiredHints:[], ing:[], expiring:0, group:'hidden', score:0};
  let req = 0, have = 0;
  for (const I of r.ing){
    const p = P(I.p); const row = {I, p, st:'ok', needQ: I.q == null ? null : I.q * k, locs:[]};
    if (idx.soon[I.p]) res.expiring++;
    if (isBasic(I.p)) row.st = 'basic';
    else {
      const items = idx.ok[I.p] || [];
      row.locs = [...new Set(items.map(i => i.locationId))];
      if (!items.length){
        const sub = I.s.find(s => isBasic(s) || (idx.ok[s] || []).length);
        if (sub){ row.st = 'sub'; row.sub = sub; row.locs = [...new Set((idx.ok[sub] || []).map(i => i.locationId))]; }
        else row.st = 'missing';
        if (idx.expired[I.p]) row.expired = true;
      } else if (I.q != null && U[I.u].d !== 'cond'){
        const dim = U[I.u].d, need = toDim(I.q * k, I.u, dim, p); let sum = 0, unsure = false;
        for (const it of items){ const v = toDim(it.quantity, it.unit, dim, p); if (v == null) unsure = true; else sum += v; }
        if (need == null) row.st = 'ok';
        else if (sum + 1e-9 < need && unsure) row.st = 'check';
        else if (sum + 1e-9 < need){ row.st = 'low'; row.haveQ = sum / U[I.u].f; }
      }

    if (row.expired) res.expiredHints.push(p.name);

      req++;
      if (row.st === 'missing') res.missing.push(row);

}
function matchesAll(){ if (MATCH) return MATCH; const idx = invIndex(); MATCH = D.RECIPES.map(r => matchRecipe(r, UI.rf.servings || 0, idx)); return MATCH; }
const canCount = () => matchesAll().filter(m => m.group === 'can').length;

function toast(msg, opts = {}){
  const box = $('#toasts'); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');

  t.querySelector('.x').onclick = close;
  box.appendChild(t); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(close, opts.ms || 4000);
  if (opts.assertive){ $('#alerts').textContent = msg; }
  return close;
}

/* ---------- рендер «обвязки» ---------- */
function renderChrome(){

function header(title, sub, opts = {}){
  return '<div class="ph">' + (opts.back ? '<a class="icon-btn" href="' + opts.back + '" aria-label="Назад">←</a>' : '') +
    '<div class="grow">' + (opts.eyebrow ? '<div class="eyebrow">' + esc(opts.eyebrow) + '</div>' : '') + '<h2>' + title + '</h2>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
    (opts.extra || '') + '<button type="button" class="icon-btn" data-act="close-panel" aria-label="Закрыть панель">✕</button></div>';
}
function renderPanel(){
  const r = UI.route; let html = '', open = true, full = false;
  switch (r.name){
    case 'kitchen': if (UI.openUnit && !listMode()) html = viewContents(UI.openUnit); else open = false; break;
    case 'expiring': html = viewExpiring(); full = true; break;
    case 'recipes': html = viewRecipes(); full = true; break;
    case 'recipe': html = viewRecipe(r.id); break;
    case 'cook': html = viewCook(r.id); break;
    case 'shopping': html = viewShopping(); full = true; break;
    case 'favorites': html = viewFavorites(); full = true; break;
    case 'settings': html = viewSettings(); full = true; break;
    case 'about': html = viewAbout(); full = true; break;
  }
  const panel = $('#panel'), inner = $('#panelInner');
  const act = document.activeElement; let focusKey = null;
  if (act && inner.contains(act)){ focusKey = act.id ? '#' + act.id : (act.dataset && act.dataset.act ? '[data-act="' + act.dataset.act + '"]' + (act.dataset.id ? '[data-id="' + act.dataset.id + '"]' : '') + (act.dataset.d ? '[data-d="' + act.dataset.d + '"]' : '') + (act.dataset.n ? '[data-n="' + act.dataset.n + '"]' : '') : null); }
  const st = inner.scrollTop;
  panel.hidden = !open;
  document.body.classList.toggle('sheet-full', open && full);
  document.body.classList.toggle('sheet-big', open && !full && UI.sheetBig);
  if (open){
    inner.innerHTML = html; inner.scrollTop = st;
    if (focusKey){ const el = inner.querySelector(focusKey); if (el) el.focus({preventScroll:true}); }
    if (UI.flashItem){ const el = inner.querySelector('[data-item="' + UI.flashItem + '"]'); if (el){ el.classList.add('flash'); el.scrollIntoView({block:'center', behavior: REDUCED ? 'auto' : 'smooth'}); } UI.flashItem = null; }
  }
}

function sortItems(arr){
  const a = arr.slice();
  if (UI.sort === 'name') a.sort((x, y) => P(x.productId).name.localeCompare(P(y.productId).name, 'ru'));
  else if (UI.sort === 'added') a.sort((x, y) => (y.addedAt || '').localeCompare(x.addedAt || ''));
  else a.sort((x, y) => byExpiry(x, y) || P(x.productId).name.localeCompare(P(y.productId).name, 'ru'));
  return a;
}

}
function filterRecipes(list){
  const f = UI.rf, q = norm(f.q);
  return list.filter(m => {
    const r = m.r;
    if (q && !norm(r.title).includes(q) && !r.ing.some(I => norm(P(I.p).name).includes(q) || P(I.p).synonyms.some(s => norm(s).includes(q)))) return false;
    if (f.meal && !r.meal.includes(f.meal)) return false;
    if (f.time && r.prep + r.cook > f.time) return false;
    if (f.diff && r.diff !== f.diff) return false;
    if (f.diet && !r.diet.includes(f.diet)) return false;
    if (f.cuisine && r.cuisine !== f.cuisine) return false;
    if (f.appl === 'no_oven' && r.app.includes('oven')) return false;
    if (f.appl === 'only_microwave' && (!r.app.includes('microwave') || r.app.some(a => a !== 'microwave' && a !== 'kettle'))) return false;
    if (f.appl.startsWith('with:') && !r.app.includes(f.appl.slice(5))) return false;
    if (f.expiring && !m.expiring) return false;
    return true;
  });
}
function sortRecipes(list){
  const s = UI.rf.sort, a = list.slice();
  if (s === 'time') a.sort((x, y) => (x.r.prep + x.r.cook) - (y.r.prep + y.r.cook));
  else if (s === 'diff') a.sort((x, y) => x.r.diff - y.r.diff || y.score - x.score);
  else if (s === 'name') a.sort((x, y) => x.r.title.localeCompare(y.r.title, 'ru'));
  else a.sort((x, y) => y.score - x.score);
  return a;
}

  const order = ['can', 'miss', 'qty'].concat(UI.rf.showNoApp ? ['noapp'] : []);

  return h;
}

function ingRow(row, k){
  const I = row.I, p = row.p, qty = I.q == null ? U[I.u].n : fmtQty(I.q * k, I.u);
  const marks = {ok:['✓','Есть'], basic:['✓','Базовый продукт'], low:['◐','Мало'], check:['◐','Проверьте количество'], missing:['✗','Нет'], sub:['↔','Можно заменить']};
  const [mk, label] = marks[row.st];
  let det = label;
  if (row.st === 'low') det = 'Мало: нужно ' + fmtQty(I.q * k, I.u) + ', есть ' + fmtQty(row.haveQ, I.u);
  if (row.st === 'sub') det = 'Нет — замена: ' + P(row.sub).name.toLowerCase();
  if (row.locs && row.locs.length && row.st !== 'missing') det += ' · ' + row.locs.map(shortLoc).join('; ');
  if (row.expired) det += ' · есть просроченный — проверьте его';
  if (I.n) det += ' · ' + I.n;
  return '<li class="ing s-' + row.st + '" data-hl-pid="' + (row.sub || I.p) + '"><span class="mk" aria-hidden="true">' + mk + '</span>' +
    '<span>' + p.emoji + ' ' + esc(p.name) + (I.o ? '<em>по желанию</em>' : '') + '</span><span class="iq">' + esc(qty) + '</span><span class="idet">' + esc(det) + '</span></li>';
}

/* ----- пошаговый режим ----- */
function ensureCooking(id){
  const c = S.cooking;
  if (!c || c.recipeId !== id || Date.now() - c.updatedAt > DAY){
    const r = D.RECIPE_MAP[id];

function planWriteoff(r, sv){
  const k = sv / r.serv, idx = invIndex();
  return r.ing.map(I => {
    let pid = I.p;
    if (!(idx.ok[pid] || []).length){ const sub = I.s.find(s => (idx.ok[s] || []).length); if (sub) pid = sub; }
    const cond = I.q == null || U[I.u].d === 'cond', has = (idx.ok[pid] || []).length > 0;

  });

function consume(pid, q, u){
  const p = P(pid), dim = U[u].d; let need = toDim(q, u, dim, p); if (need == null) return 0; let used = 0;
  const items = S.inventory.filter(i => (i.productId === pid || linkedOf(i.productId) === pid) && expStatus(i) !== 'expired').sort(byExpiry);
  for (const it of items){
    if (need <= 1e-9) break;
    const avail = toDim(it.quantity, it.unit, dim, p); if (avail == null || avail <= 0) continue;
    const take = Math.min(avail, need); it.quantity = round3(it.quantity * (avail - take) / avail); need -= take; used += take;
    it.updatedAt = new Date().toISOString();
  }
  S.inventory = S.inventory.filter(i => i.quantity > 1e-6);

}

function productOption(p){ return '<span class="dd-ico">' + p.emoji + '</span><span>' + esc(p.name) + '<div class="dd-sub">' + esc(D.CATEGORIES[p.category] || '') + (p.custom ? ' · свой продукт' : '') + '</div></span>'; }
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function searchProducts(q, limit = 8){
  q = norm(q); if (!q) return [];
  const tol = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0; const res = [];
  for (const p of allProducts()){
    let best = 99;
    for (const nm of [p.name].concat(p.synonyms || [])){
      const n = norm(nm), words = n.split(/[\s,()%-]+/).filter(Boolean);
      if (n.startsWith(q)) best = Math.min(best, 0);
      else if (words.some(w => w.startsWith(q))) best = Math.min(best, 1);
      else if (n.includes(q)) best = Math.min(best, 2);
      else if (tol) for (const w of words){ const d = Math.min(lev(q, w.slice(0, q.length)), lev(q, w)); if (d <= tol) best = Math.min(best, 3 + d); }
    }
    if (best < 99) res.push([best, p]);
  }
  res.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length);
  return res.slice(0, limit).map(x => x[1]);
}
function bindAC(input, list, onPick, opts = {}){
  let items = [], idx = -1;
  const source = opts.source || (q => searchProducts(q, 8).map(p => ({type:'p', p, html:productOption(p)})));
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); idx = -1; };
  const render = () => {
    const q = input.value.trim(); items = q ? source(q) : []; if (opts.extra) items = items.concat(opts.extra(q, items));
    if (!items.length){ close(); return; }
    list.innerHTML = items.map((it, i) => '<li role="option" id="' + list.id + '-o' + i + '" data-i="' + i + '" aria-selected="false">' + it.html + '</li>').join('');
    list.hidden = false; input.setAttribute('aria-expanded', 'true');
  };
  const upd = () => { $$('[role=option]', list).forEach((o, i) => o.setAttribute('aria-selected', String(i === idx))); if (idx >= 0){ input.setAttribute('aria-activedescendant', list.id + '-o' + idx); const el = list.children[idx]; if (el) el.scrollIntoView({block:'nearest'}); } };
  const pick = i => { const it = items[i]; close(); if (it) onPick(it); };
  input.addEventListener('input', () => { idx = -1; delete input.dataset.pid; render(); });
  input.addEventListener('focus', () => { if (input.value.trim()) render(); });
  input.addEventListener('keydown', e => {
    if (list.hidden) return;
    if (e.key === 'ArrowDown'){ idx = Math.min(items.length - 1, idx + 1); upd(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ idx = Math.max(0, idx - 1); upd(); e.preventDefault(); }
    else if (e.key === 'Enter' && idx >= 0){ e.preventDefault(); pick(idx); }
    else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
  });
  list.addEventListener('mousedown', e => { const li = e.target.closest('[role=option]'); if (!li) return; e.preventDefault(); pick(+li.dataset.i); });
  input.addEventListener('blur', () => setTimeout(close, 150));
}

function pfSave(){
  const nameV = $('#pf-name').value.trim(); let ok = true;
  ['pf-err-name','pf-err-qty','pf-err-exp'].forEach(id => $('#' + id).textContent = '');
  if (!nameV){ $('#pf-err-name').textContent = 'Укажите название продукта'; ok = false; }
  else if (!PF.pid && !PF.custom){
    const m = searchProducts(nameV, 1)[0];
    if (m && norm(m.name) === norm(nameV)) PF.pid = m.id;
    else { $('#pf-err-name').textContent = 'Выберите продукт из списка или создайте свой'; ok = false; }
  }
  const q = parseFloat(String($('#pf-qty').value).replace(',', '.'));
  if (!(q > 0)){ $('#pf-err-qty').textContent = 'Укажите количество больше 0'; ok = false; }
  else if (q > 100000){ $('#pf-err-qty').textContent = 'Слишком большое количество (не больше 100 000)'; ok = false; }
  const exp = $('#pf-exp').value;
  if (exp && exp < addDaysISO(-365)){ $('#pf-err-exp').textContent = 'Дата не может быть раньше, чем год назад'; ok = false; }
  if (!ok) return;
  const loc = $('#pf-loc').value, unit = $('#pf-unit').value, note = $('#pf-note').value.trim();
  if (!PF.warnAck && !PF.custom){
    const p = P(PF.pid), lz = D.STORAGE_MAP[loc].zone;
    if (p.zone !== lz && (p.zone === 'freezer' || p.zone === 'fridge')){
      const w = $('#pf-warn'); w.hidden = false; w.textContent = 'Обычно этот продукт хранят ' + (p.zone === 'freezer' ? 'в морозилке' : 'в холодильнике') + '. Всё равно положить сюда? Нажмите «Сохранить» ещё раз.';
      PF.warnAck = true; return;
    }
  }
  let pid = PF.pid;
  if (PF.custom){
    const cp = {id:'custom_' + uid().replace(/-/g, '').slice(0, 10), name:nameV.slice(0, 80), emoji:'📦', category:$('#pf-cat').value, defaultUnit:unit, allowedUnits:dimUnits(unit), place:loc, zone:D.STORAGE_MAP[loc].zone, synonyms:[], color:'#A9B4AE', linkedTo:$('#pf-link').value || null, custom:true};
    S.customProducts.push(cp); pid = cp.id;
  }
  const d = $('#dlgProduct'), p = P(pid);
  if (PF.mode === 'add'){
    withUndo(p.name + ' ' + fmtQty(q, unit) + ' добавлено ' + unitOfLoc(loc).to, () => addInventory({productId:pid, locationId:loc, quantity:q, unit, expiresAt:exp || undefined, note}));
    requestPersist();
    if ($('#pf-more').checked){ ['pf-name','pf-qty','pf-exp','pf-note'].forEach(id => $('#' + id).value = ''); PF.pid = null; PF.custom = false; PF.warnAck = false; PF.presetLoc = loc; $('#pf-presets').innerHTML = ''; $('#pf-custom').hidden = true; $('#pf-name').focus(); }
    else d.close();
  } else {
    const it = findItem(PF.itemId);
    withUndo('Изменения сохранены', () => Object.assign(it, {productId:pid, quantity:round3(q), unit, locationId:loc, expiresAt:exp || undefined, note:note || undefined, updatedAt:new Date().toISOString()}));
    d.close();
  }
}

/* ---------- таймеры ---------- */
let audioCtx = null, wakeLock = null;
function ensureAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
function beep(){
  ensureAudio(); if (!audioCtx) return; const v = Math.max(0.001, S.settings.soundVolume * 0.5), t0 = audioCtx.currentTime;
  for (let i = 0; i < 4; i++){ const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * 0.32; o.type = 'sine'; o.frequency.value = i % 2 ? 660 : 880;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28); o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.3); }
}
function startTimer(sec, label, appl, stepKey){
  ensureAudio();
  S.timers.push({id:uid(), label, endAt:Date.now() + sec*1000, dur:sec, appl:appl || null, stepKey, done:false}); save(); renderTimers();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  toast('Таймер запущен: ' + fmtDur(sec));
}
function alarm(t){
  if (S.settings.soundEnabled) beep();
  if (navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
  if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible'){ try { new Notification('⏰ Время вышло', {body:t.label}); } catch(e){} }
  toast('⏰ Время вышло: ' + t.label, {assertive:true, ms:9000});
}
function tick(){
  const now = Date.now(); let ch = false;
  S.timers.forEach(t => { if (!t.done && now >= t.endAt){ t.done = true; ch = true; alarm(t); } });
  if (ch){ save(); if (UI.route.name === 'cook') renderPanel(); }
  renderTimers();
}
function renderTimers(){
  const bar = $('#timerbar'), ids = new Set(S.timers.map(t => t.id));
  $$('.tchip', bar).forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  S.timers.forEach(t => {
    let el = bar.querySelector('.tchip[data-id="' + t.id + '"]');
    if (!el){ el = document.createElement('div'); el.className = 'tchip'; el.dataset.id = t.id; el.innerHTML = '<span class="tl"></span><span class="tv"></span><button type="button" data-act="timer-x" data-id="' + t.id + '" aria-label="Убрать таймер">✕</button>';
      el.querySelector('.tl').textContent = (t.appl ? D.APPL_MAP[t.appl].emoji + ' ' : '⏱ ') + t.label; bar.appendChild(el); }
    el.classList.toggle('done', t.done); const tv = t.done ? 'Готово!' : fmtClock(t.endAt - Date.now()); const tvEl = el.querySelector('.tv'); if (tvEl.textContent !== tv) tvEl.textContent = tv;
  });
  const running = S.timers.filter(t => !t.done && t.appl);
  const sc = SC(); if (sc) sc.setTimers(running.map(t => ({appl:t.appl, text:fmtClock(t.endAt - Date.now())})));
  const ov = $('#overlay'); const want = new Map(); running.forEach(t => { if (!['oven','microwave','hob','coffee_machine'].includes(t.appl) && !want.has(t.appl)) want.set(t.appl, fmtClock(t.endAt - Date.now())); });
  $$('.atimer', ov).forEach(el => { if (!want.has(el.dataset.appl) || !sc) el.remove(); });
  if (sc) want.forEach((txt, appl) => { let el = ov.querySelector('.atimer[data-appl="' + appl + '"]'); if (!el){ el = document.createElement('div'); el.className = 'atimer'; el.dataset.appl = appl; el.dataset.anchor = 'a:' + appl; el.dataset.dy = '-26'; ov.appendChild(el); } if (el.textContent !== '⏱ ' + txt) el.textContent = '⏱ ' + txt; });
}
async function requestWake(){ if (!S.settings.wakeLock || !('wakeLock' in navigator) || wakeLock) return; try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch(e){} }
function releaseWake(){ if (wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; } }

/* ---------- диалоги ---------- */
function ask({title, text, html, buttons, input, vertical}){
  return new Promise(res => {
    const d = $('#dlg'); let done = false;
    const finish = v => { if (done) return; done = true; d.onclose = null; if (d.open) d.close(); res(v); };
    d.innerHTML = '<div class="dwrap"><div class="dh"><h2 id="dlgTitle">' + esc(title) + '</h2><button type="button" class="icon-btn" data-ask-x aria-label="Закрыть">✕</button></div>' + (text ? '<p>' + esc(text) + '</p>' : '') + (html || '') +
      (input ? '<input id="askInput" placeholder="' + esc(input.placeholder || '') + '" style="width:100%" aria-label="Подтверждение">' : '') +
      '<div class="' + (vertical ? 'stack' : 'dfoot') + '" style="margin-top:16px">' + (vertical ? '' : '<span class="grow"></span>') + buttons.map((b, i) => '<button type="button" class="btn ' + (b.cls || '') + (vertical ? ' block' : '') + '" data-ask="' + i + '"' + (b.needInput ? ' disabled' : '') + '>' + esc(b.label) + '</button>').join('') + '</div></div>';
    d.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => finish(buttons[+b.dataset.ask].value));
    d.querySelector('[data-ask-x]').onclick = () => finish(null);
    if (input){ const inp = $('#askInput'); inp.oninput = () => d.querySelectorAll('[data-ask]').forEach((b, i) => { if (buttons[i].needInput) b.disabled = norm(inp.value) !== input.match; }); }
    d.onclose = () => finish(null);
    if (!d.open) d.showModal();
    setTimeout(() => { const f = input ? $('#askInput') : d.querySelector('[data-ask]:last-child'); if (f) f.focus(); }, 30);
  });
}

function validateImport(d){
  if (!d || typeof d !== 'object' || d.app !== 'holodilnik') throw new Error('это не файл «Холодильника»');
  if (d.schemaVersion !== 1) throw new Error('неподдерживаемая версия файла');
  const arr = k => { if (d[k] == null) d[k] = []; if (!Array.isArray(d[k])) throw new Error('поле «' + k + '» повреждено'); return d[k]; };
  const str = v => typeof v === 'string' && v.length < 300; const now = new Date().toISOString();
  arr('customProducts');
  d.customProducts = d.customProducts.filter(c => c && str(c.id) && str(c.name) && U[c.defaultUnit] && U[c.defaultUnit].d !== 'cond').map(c => { const place = D.STORAGE_MAP[c.place] ? c.place : 'cabinet_lower_2';
    return {id:c.id, name:c.name.slice(0, 80), emoji:'📦', category:D.CATEGORIES[c.category] ? c.category : 'other', defaultUnit:c.defaultUnit, allowedUnits:dimUnits(c.defaultUnit), place, zone:D.STORAGE_MAP[place].zone, synonyms:[], color:'#A9B4AE', linkedTo:D.PRODUCTS[c.linkedTo] ? c.linkedTo : null, custom:true}; });

  d.inventory = d.inventory.filter(i => i && known(i.productId) && D.STORAGE_MAP[i.locationId] && U[i.unit] && typeof i.quantity === 'number' && i.quantity > 0 && i.quantity <= 100000)
    .map(i => ({id:str(i.id) ? i.id : uid(), productId:i.productId, locationId:i.locationId, quantity:i.quantity, unit:i.unit, expiresAt:/^\d{4}-\d{2}-\d{2}$/.test(i.expiresAt || '') ? i.expiresAt : undefined, addedAt:str(i.addedAt) ? i.addedAt : now, updatedAt:now, note:str(i.note) ? i.note : undefined}));
  arr('favorites'); d.favorites = d.favorites.filter(f => f && D.RECIPE_MAP[f.recipeId]).map(f => ({recipeId:f.recipeId, addedAt:str(f.addedAt) ? f.addedAt : now}));
  arr('shopping'); d.shopping = d.shopping.filter(s => s && known(s.productId) && U[s.unit] && typeof s.quantity === 'number' && s.quantity > 0).map(s => ({id:str(s.id) ? s.id : uid(), productId:s.productId, quantity:s.quantity, unit:s.unit, fromRecipeId:D.RECIPE_MAP[s.fromRecipeId] ? s.fromRecipeId : undefined, checked:!!s.checked}));
  arr('history'); d.history = d.history.filter(h => h && D.RECIPE_MAP[h.recipeId]).map(h => ({id:str(h.id) ? h.id : uid(), recipeId:h.recipeId, servings:+h.servings || 1, cookedAt:str(h.cookedAt) ? h.cookedAt : now, consumed:Array.isArray(h.consumed) ? h.consumed.filter(c => c && known(c.productId) && U[c.unit]).map(c => ({productId:c.productId, quantity:+c.quantity || 0, unit:c.unit})) : []}));
  const s = d.settings && typeof d.settings === 'object' ? d.settings : {};
  d.settings = Object.assign({}, DEFAULT_SETTINGS, {
    basicProducts:Array.isArray(s.basicProducts) ? s.basicProducts.filter(id => D.PRODUCTS[id]) : DEFAULT_SETTINGS.basicProducts.slice(),
    unavailableAppliances:Array.isArray(s.unavailableAppliances) ? s.unavailableAppliances.filter(id => D.APPL_MAP[id]) : [],

<script type="module">

const stoneTex = canvasTex(1024, 256, (g, w, h) => {

const tileTex = canvasTex(512, 256, (g, w, h) => {

}

  if (renderer.shadowMap.enabled !== sh){ renderer.shadowMap.enabled = sh; scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); }
  const ms = eff === 'high' ? 2048 : 1024;
  if (sun.shadow.mapSize.x !== ms){ sun.shadow.mapSize.set(ms, ms); if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; } }
  resize();
}
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const dark = darkMQ.matches;
  scene.background = new THREE.Color(dark ? '#2A2622' : '#E9E5DD');
  hemi.intensity = dark ? 0.22 : 0.55; sun.intensity = dark ? 0.6 : 2.0; sun.color.set(dark ? '#FFC58A' : '#FFF4E5');
  ledLights.forEach(l => l.intensity = dark ? 4.5 : 2.2); M.led.emissiveIntensity = dark ? 2.6 : 1.2;
  renderer.toneMappingExposure = dark ? 0.9 : 1.0; windowMat.color.set(dark ? '#2B3A55' : '#FFFFFF'); invalidate();
}
darkMQ.addEventListener('change', applyTheme); applyTheme();

/* ---------- цикл рендера (по требованию) ---------- */
let fpsUntil = 0, frames = 0, fpsChecked = false;
const t0 = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  stepTweens(now);
  const t = (now - t0)/1000;
  if (activeId && appls[activeId] && appls[activeId].fx.update){ appls[activeId].fx.update(t); const a = appls[activeId]; if (a.halo) a.halo.material.opacity = 0.6 + 0.25*Math.sin(t*3); a.mats.forEach(m => m.emissiveIntensity = 0.16 + 0.1*Math.sin(t*4)); }
  const parts = updateParticles(now);
  const busy = tweens.size > 0 || !!activeId || parts || emitters.size > 0 || now < fpsUntil;
  if (!dirty && !busy) return;
  dirty = false;
  applyCamera(); renderer.render(scene, camera); updateOverlay();
  if (now < fpsUntil) frames++;
  else if (fpsUntil && !fpsChecked){
    fpsChecked = true; const fps = frames / 5;
    if (fps < 20) App.onLowFps();
    if (qualitySetting === 'auto' && fps < 40 && autoQ !== 'low'){ autoQ = fps < 28 ? 'low' : 'medium'; setQuality('auto'); }
  }
}

/* ---------- API для приложения ---------- */
window.Scene3D = {
  ready:true, openUnit, closeUnit:silent => closeUnitInternal(!silent), syncInventory, showRecipe, clearRecipe:() => clearRecipe(false),
  setActive:(id, label, overview) => setActive(id, label, overview), setTimers, setQuality, resize, refresh:invalidate,
  hover:(kind, id) => setHover(kind || null, id), highlightUnit, pulseProduct
};
resize();
const ov0 = computeOverview(); view.pos.copy(ov0.pos); view.target.copy(ov0.target);
requestAnimationFrame(loop);
renderer.compile(scene, camera);
setTimeout(() => { fpsUntil = performance.now() + 5000; frames = 0; }, 1500);
App.onSceneReady();
}
